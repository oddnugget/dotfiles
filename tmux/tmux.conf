# vim: set ft=tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"


set -g prefix ^a

unbind R
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind / last-window


bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind '"' choose-window

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g mouse on
set -g allow-passthrough on       # let nvim draw images (snacks.image) through tmux

setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Colorschemes
set -ogq @catppuccin_window_text " #W"
set -ogq @catppuccin_window_current_text " #W"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background "#{@thm_bg}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Catppuccin centres prompts, but tmux draws the prompt cursor as if the text
# were left-aligned, so it lands on top of the text (e.g. in rename-window).
# tmux 3.7 also only paints the prompt's own width unless a fill colour is set,
# leaving the window pills visible underneath the typed command.
set -agF message-style "align=left,fill=#{E:@catppuccin_status_background}"
set -agF message-command-style "align=left,fill=#{E:@catppuccin_status_background}"


set -g status-right-length 100

set -g status-left ""


set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g status 2
set -g status-format[1] ''


# Vim tmux nav: smart-splits.nvim sets @pane-is-vim while nvim runs in a pane
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h"  "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j"  "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k"  "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if -F "#{@pane-is-vim}" "send-keys C-\\" "select-pane -l"

# Tmux resize
bind C-l resize-pane -R 10
bind C-h resize-pane -L 10
bind C-k resize-pane -U 10
bind C-j resize-pane -D 10


