# herdr config, modelled on tmux/tmux.conf.
# Full reference: `herdr --default-config`. Validate: `herdr config check`.
# Apply without restarting: prefix+R or `herdr server reload-config`.

onboarding = false

[theme]
name = "catppuccin"

[keys]
# Same prefix as tmux
prefix = "ctrl+a"

# tmux: bind s / bind v split in the current pane's directory
# (herdr's new_cwd = "follow" default does the cwd part).
split_vertical = "prefix+v"   # side by side
split_horizontal = "prefix+s" # stacked
# prefix+s was settings; move it out of the way
settings = "prefix+comma"

# tmux: bind / last-window. herdr has no "last tab", so jump back to the last pane.
last_pane = "prefix+slash"

# tmux: bind '"' choose-window
workspace_picker = "prefix+w"

# tmux: bind C-h/j/k/l resize-pane
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"

[ui]
# tmux-style splits: internal dividers only, no outer frame or gaps
pane_outer_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

# tmux creates windows immediately without asking for a name
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
tab_bar_position = "top" # tmux: status-position top

status_indicators = "symbols"

[ui.toast]
# OSC desktop notification via the outer terminal (Ghostty), works over ssh
delivery = "terminal"

[advanced]
# tmux keeps 1M lines; bump from the 10MB default
scrollback_limit_bytes = 50000000
